<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Down the River White Water Rafting: Contact Us</title>
    <meta name="description" content="Send a message to Down the River White Water Rafting">
    <meta name="author" content="SummerDale Beckstrand">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo-small.png"
          alt="Down the river logo, with sun and clouds over a river in a pine forest, with three rafting tubes in the river">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Down the River White Water Rafting</h1>
        <div class="addressfield shadedoutline">
            <div class="address">
                123 Main Street<br>
                Kolob, California
            </div>
            <div class="address">
                +1 999 999 9999
            </div>
            <div class="address">
                info@downtheriver.com
            </div>
        </div>
        <div class="grid">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3022.669500400809!2d-111.92411159114063!3d40.74729733589867!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sriver%20salt%20lake!5e0!3m2!1sen!2sus!4v1785016648281!5m2!1sen!2sus"
              allowfullscreen loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <div class="contact">
                <form class="shadedoutline">
                    <div class="formitem column">
                        <label for="name" class="bold">Name</label>
                        <input type="text" id="name" name="name" placeholder="Name">
                    </div>
                    <div class="formitem column">
                        <label for="email" class="bold">Email</label>
                        <input type="email" id="email" name="email"
                          placeholder="john.doe@example.com">
                    </div>
                    <div class="formitem">
                        <label class="bold">Message Purpose</label><br>
                        <input type="radio" id="general" name="purpose">
                        <label for="general">General Inquiry</label><br>
                        <input type="radio" id="reservation" name="purpose">
                        <label for="reservation">Reservation Question</label><br>
                        <input type="radio" id="website" name="purpose">
                        <label for="website">Website Suggestion</label>
                    </div>
                    <div class="formitem">
                        <label for="message" class="bold">Message</label><br>
                        <textarea id="message" placeholder="Type here"></textarea>
                    </div>
                    <div class="formitem">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                    </div>
                    <div class="formitem">
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>
        </div>
        <section class="shadedoutline">
            <h2>We Are Here to Serve You</h2>
            <div class="profile">
                <figure>
                    <img class="shadedoutline" src="images/sdb-2007.jpg">
                    <figcaption>Young SummerDale<br>
                        <span class="bold">C.E.O.</span>
                    </figcaption>
                </figure>
                <figure>
                    <img class="shadedoutline" src="images/sdb-plants-small.jpg">
                    <figcaption>Plant SummerDale<br>
                        <span class="bold">Nature Guide</span>
                    </figcaption>
                </figure>
                <figure>
                    <img class="shadedoutline" src="images/sdb-black.jpg">
                    <figcaption>SummerDale B.<br>
                        <span class="bold">Adventure Planner</span>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Down the River, SummerDale Beckstrand</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg"
                  alt="Instagram icon"></a>
            <a href="https://youtube.com"><img src="images/youtube.svg" alt="YouTube icon"></a>
        </nav>
    </footer>
</body>

</html>
